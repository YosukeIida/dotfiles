name: nix-check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check -L
      - run: nix eval .#darwinConfigurations.example.config.system.build.toplevel.drvPath

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix run nixpkgs#gitleaks -- detect --source . --no-git --redact --verbose --exit-code 1

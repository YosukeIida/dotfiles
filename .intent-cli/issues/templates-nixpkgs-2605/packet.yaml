implementation_issue_packet:
  issue_title: "devshell テンプレートの nixpkgs を 26.05-darwin に上げる"
  issue_kind: chore
  source_execution_unit: templates-nixpkgs-2605
  domain: dotfiles
  target_repo: YosukeIida/dotfiles
  target_path: templates/node/nix templates/python-uv/nix
  target_part: "devshell テンプレート2本の flake input（本体 flake は対象外）"
  dependencies: []
  technical_baseline:
    - "templates/node/nix と templates/python-uv/nix は本体 flake とは独立した flake で、`follows` による連動を持たない"
    - "dependabot PR #10 / #11 が同一の変更を提案している（両者の diff は完全に一致）"
    - "本体の flake input（#8 / #9 / #12）は `follows` で連動するため別 execution unit に分離してある"
  intent_references:

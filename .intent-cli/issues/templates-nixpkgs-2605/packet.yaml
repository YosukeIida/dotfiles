  acceptance_criteria:
    - "templates/node/nix/flake.nix と templates/python-uv/nix/flake.nix の nixpkgs.url が github:NixOS/nixpkgs/nixpkgs-26.05-darwin を指す"
    - "両方の flake.lock で nixpkgs の original.ref が nixpkgs-26.05-darwin に更新され、locked.rev が 25.11 系の rev から変わっている"
    - "各テンプレートディレクトリで nix flake check が成功する（重い場合は nix develop --command true で devshell が起動することを示す）"
    - "リポジトリ直下の flake.nix と flake.lock に差分がない（更新単位の境界を越えていないことの証明）"
    - "PR 本文に Closes #<issue> がある"


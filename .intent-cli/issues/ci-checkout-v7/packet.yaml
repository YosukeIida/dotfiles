closeout_learning:
  expected: "OQ-2 の本命の実測。この slice は1ファイル2行の変更であり、OQ-2 が想定した『1行修正のような典型作業に13セクション contract は過剰か』にちょうど当たる。1周目（4ファイル・設計判断を含む）では過剰さが出なかったため、最小規模での authoring コストと得られた価値を測って OQ-2 の回答を更新する。加えて2周目として、初回のみ必要だった gate（ラベル作成・atomic-seed・title キーの発見）が消えた状態の所要を記録する。"
  write_back_required: true
  write_back_targets:
    - intents/dotfiles/features/intent-cli-integration/open-questions.md

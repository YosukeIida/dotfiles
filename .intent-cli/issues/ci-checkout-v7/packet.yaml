# publish-flow が読むタイトルキーはトップレベルの `title:`。
# 値は implementation_issue_packet.issue_title と逐語一致させる（1周目に踏んだ罠）。
title: "CI の actions/checkout を v7 に上げる"
implementation_issue_packet:
  issue_title: "CI の actions/checkout を v7 に上げる"
  issue_kind: chore
  source_execution_unit: ci-checkout-v7
  domain: dotfiles
  target_repo: YosukeIida/dotfiles
  target_path: .github/workflows/nix-check.yml
  target_part: "nix-check ワークフローの actions/checkout ピン（2箇所）"
  dependencies: []
  technical_baseline:
    - "CI は operations/dependency-updates.md が定める3つの更新単位のうち独立した1つ。本体 flake input とは連動しない"
    - "dependabot PR #14 が同一の変更を提案している"
    - "actions/checkout は nix-check.yml の2ジョブ（nix / secrets）で使われており、両方を揃えて上げる"
  intent_references:
    - intents/dotfiles/operations/dependency-updates.md
  acceptance_criteria:
    - ".github/workflows/nix-check.yml の actions/checkout の参照が2箇所とも actions/checkout@v7 である"
    - "リポジトリ内に actions/checkout@v6 への参照が残っていない"
    - "PR の CI（nix / secrets の両ジョブ）が green である。CI 実行そのものが検証手段になる"
    - ".github/workflows/nix-check.yml 以外に差分がない"
    - "PR 本文に Closes #<issue> がある"


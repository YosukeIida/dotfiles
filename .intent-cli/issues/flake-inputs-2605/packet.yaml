# publish-flow が読むタイトルキーはトップレベルの `title:`。
title: "本体 flake input を 26.05 系に揃える"
implementation_issue_packet:
  issue_title: "本体 flake input を 26.05 系に揃える"
  issue_kind: chore
  source_execution_unit: flake-inputs-2605
  domain: dotfiles
  target_repo: YosukeIida/dotfiles
  target_path: flake.nix flake.lock
  target_part: "本体 flake の nixpkgs / nix-darwin / home-manager のリリース系列"
  dependencies: []
  technical_baseline:
    - "nix-darwin と home-manager は inputs.nixpkgs.follows = \"nixpkgs\" で本体の nixpkgs を共有しており、リリース系列を個別に上げるとどちらのリリースでもない中間状態が生まれる。3本まとめて動かす"
    - "dependabot PR #8（nix-darwin）/ #9（nixpkgs）/ #12（home-manager）が個別に提案している。3本とも flake.nix と flake.lock の同じファイルを変更するため、1本 merge すると残りが conflict する"
    - "nixpkgs-unstable は ref を持たず常に最新を指すため、`nix flake update` を無指定で実行すると一緒に動く。この slice の範囲外なので input を明示して更新する（nix 2.31.5 なので `nix flake update <input>...` が使える）"
    - "stateVersion は後方互換のマーカーであり、リリース系列の移行では変更しない（home.stateVersion = \"25.11\" / system.stateVersion = 6）"
    - "検証は `darwin-rebuild build` で行う。build はシステムを変更しないので実装用 worktree 内で完結する。実機適用（switch）は host 側の作業"
  intent_references:
    - intents/dotfiles/operations/dependency-updates.md
  acceptance_criteria:
    - "flake.nix の nixpkgs.url が nixpkgs-26.05-darwin、nix-darwin.url が nix-darwin-26.05、home-manager.url が release-26.05 を指す"
    - "flake.lock でこの3つの original.ref が更新され、locked.rev が 25.11 系の値から変わっている"
    - "flake.lock の nixpkgs-unstable の locked.rev が変わっていない（更新範囲を絞ったことの証明）"
    - "`darwin-rebuild build --flake .#Yosukes-MacBook-Air` が成功する。失敗した場合は原因と切り分けを PR に記載する"
    - "home.stateVersion と system.stateVersion が変更されていない"
    - "flake.nix と flake.lock 以外に差分がない。ただし 26.05 での option 改名・パッケージ名変更に追随する修正が必要な場合は、その差分と根拠を PR に明記すれば範囲内とする"
    - "PR 本文に Closes #<issue> がある"

intent_placement:
  primary_intent: intents/dotfiles/operations/dependency-updates.md
  supporting_intents: []

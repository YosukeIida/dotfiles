closeout_learning:
  expected: "本体 flake の移行で `darwin-rebuild build` が実装用 worktree 内の検証手段として実際に機能したかを記録する。機能したなら operations/dependency-updates.md の「実機検証の分担」を build/switch の区別を含む形に更新する（現在の記述は switch のみを前提にしており、build が worktree 内で使えることを反映していない）。"
  write_back_required: true
